version: 1
program_name: wc-lite
reference:
  cmd: ./ref/wc-lite
  build: cc -O2 -o ref/wc-lite ref/wc-lite.c
candidate:
  cmd: ./port/target/release/wc-lite
  build: cargo build --release --manifest-path port/Cargo.toml
sandbox:
  mode: local
  timeout: 10s
corpus:
  # A few cases per feature here; with the default of 20, every feature would be under-sampled.
  min_cases_per_feature: 3
